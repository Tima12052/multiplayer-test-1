<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platformer Gun Fighter — Normal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>⚔ Platformer Gun Fighter — Normal Mode</h1>
<div class="controls">
  <p><strong>Player 1 (Blue):</strong> A / D move · W jump · Mouse aims · Left Click shoots</p>
  <p><strong>Player 2 (Red):</strong> ← / → move · ↑ jump · L shoots (fires the way you're facing)</p>
  <p>R — restart round · Walls block bullets, so use cover!</p>
</div>
<canvas id="gameCanvas" width="960" height="540"></canvas>
<script src="game.js"></script>
</body>
</html>
