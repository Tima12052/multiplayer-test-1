<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Multiplayer Plattformer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h2>Multiplayer Plattformer + Combat</h2>
        <p>Bewegen: <b>A / D</b> oder <b>Pfeiltasten</b> | Springen: <b>W / Leertaste</b></p>
        <p>Schießen: <b>F</b> oder <b>Eingabetaste (Enter)</b> | Respawn bei Tod: <b>R</b></p>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>
    <script src="game.js"></script>
</body>
</html>
